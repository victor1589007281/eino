apiVersion: v1
kind: Secret
metadata:
  name: {{ include "image-gen-agent.fullname" . }}-secrets
  labels:
    {{- include "image-gen-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  STABILITY_API_KEY: {{ .Values.secrets.stabilityApiKey | quote }}
  ARK_API_KEY: {{ .Values.secrets.arkApiKey | quote }}
  QWEN_API_KEY: {{ .Values.secrets.qwenApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
