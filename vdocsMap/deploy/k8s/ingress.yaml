apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-gen-agent
  namespace: image-gen-agent
  labels:
    app.kubernetes.io/name: image-gen-agent
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod  # 可选，用于自动 HTTPS
spec:
  tls:
    - hosts:
        - image-gen.example.com
      secretName: image-gen-agent-tls
  rules:
    - host: image-gen.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: image-gen-agent
                port:
                  name: http
---
# HPA 自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: image-gen-agent
  namespace: image-gen-agent
  labels:
    app.kubernetes.io/name: image-gen-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: image-gen-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
