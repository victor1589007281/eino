apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-gen-agent-data
  namespace: image-gen-agent
  labels:
    app.kubernetes.io/name: image-gen-agent
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # 根据集群配置调整
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-gen-agent-output
  namespace: image-gen-agent
  labels:
    app.kubernetes.io/name: image-gen-agent
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany  # 支持多 Pod 读写
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard  # 根据集群配置调整
