apiVersion: v1
kind: Secret
metadata:
  name: image-gen-agent-secrets
  namespace: image-gen-agent
  labels:
    app.kubernetes.io/name: image-gen-agent
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # OpenAI API Key
  OPENAI_API_KEY: "your-openai-api-key"
  
  # Stability AI API Key (用于动图生成)
  STABILITY_API_KEY: "your-stability-api-key"
  
  # 其他 LLM 提供商 API Keys (可选)
  ARK_API_KEY: ""
  QWEN_API_KEY: ""
  DEEPSEEK_API_KEY: ""
