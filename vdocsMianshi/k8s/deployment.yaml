apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-expert
  namespace: interview-expert
  labels:
    app: interview-expert
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interview-expert
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: interview-expert
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: interview-expert
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: interview-expert
          image: interview-expert:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: ZHIPU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: interview-expert-secrets
                  key: ZHIPU_API_KEY
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: interview-expert-secrets
                  key: DEEPSEEK_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: interview-expert-secrets
                  key: OPENAI_API_KEY
          args:
            - serve
            - --config=/etc/interview-expert/config.yaml
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/interview-expert
              readOnly: true
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: interview-expert-config
        - name: data
          persistentVolumeClaim:
            claimName: interview-expert-data
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: interview-expert
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: interview-expert
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: interview-expert
  namespace: interview-expert
  labels:
    app: interview-expert
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: interview-expert-data
  namespace: interview-expert
  labels:
    app: interview-expert
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
