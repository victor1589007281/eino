apiVersion: v1
kind: Secret
metadata:
  name: interview-expert-secrets
  namespace: interview-expert
  labels:
    app: interview-expert
type: Opaque
data:
  # Base64 encoded values - replace with actual API keys
  # echo -n "your-api-key" | base64
  ZHIPU_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  OPENAI_API_KEY: ""
---
# 示例: 如何设置 Secret
# kubectl create secret generic interview-expert-secrets \
#   --namespace=interview-expert \
#   --from-literal=ZHIPU_API_KEY=your-zhipu-api-key \
#   --from-literal=DEEPSEEK_API_KEY=your-deepseek-api-key \
#   --from-literal=OPENAI_API_KEY=your-openai-api-key
