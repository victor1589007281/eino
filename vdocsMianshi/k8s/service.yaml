apiVersion: v1
kind: Service
metadata:
  name: interview-expert
  namespace: interview-expert
  labels:
    app: interview-expert
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: interview-expert
---
# Service for headless discovery if needed
apiVersion: v1
kind: Service
metadata:
  name: interview-expert-headless
  namespace: interview-expert
  labels:
    app: interview-expert
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: interview-expert
