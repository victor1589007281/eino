apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mysql-expert-agent.fullname" . }}
  labels:
    {{- include "mysql-expert-agent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mysql-expert-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mysql-expert-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mysql-expert-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.config.stats.prometheus.port }}
              protocol: TCP
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql-expert-agent.fullname" . }}-secrets
                  key: OPENAI_API_KEY
            - name: WENXIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql-expert-agent.fullname" . }}-secrets
                  key: WENXIN_API_KEY
            - name: WENXIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql-expert-agent.fullname" . }}-secrets
                  key: WENXIN_SECRET_KEY
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql-expert-agent.fullname" . }}-secrets
                  key: QWEN_API_KEY
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql-expert-agent.fullname" . }}-secrets
                  key: DEEPSEEK_API_KEY
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /data
            {{- if .Values.sourceCodePvc.enabled }}
            - name: source
              mountPath: /data/source
              readOnly: true
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mysql-expert-agent.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mysql-expert-agent.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.sourceCodePvc.enabled }}
        - name: source
          persistentVolumeClaim:
            claimName: {{ .Values.sourceCodePvc.existingClaim | default (printf "%s-source" (include "mysql-expert-agent.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
