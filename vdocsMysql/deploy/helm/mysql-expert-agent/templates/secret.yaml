{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mysql-expert-agent.fullname" . }}-secrets
  labels:
    {{- include "mysql-expert-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | quote }}
  WENXIN_API_KEY: {{ .Values.secrets.wenxinApiKey | quote }}
  WENXIN_SECRET_KEY: {{ .Values.secrets.wenxinSecretKey | quote }}
  QWEN_API_KEY: {{ .Values.secrets.qwenApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  SPARK_APP_ID: {{ .Values.secrets.sparkAppId | quote }}
  SPARK_API_KEY: {{ .Values.secrets.sparkApiKey | quote }}
  SPARK_API_SECRET: {{ .Values.secrets.sparkApiSecret | quote }}
{{- end }}
