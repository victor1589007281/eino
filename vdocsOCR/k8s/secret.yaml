apiVersion: v1
kind: Secret
metadata:
  name: ocr-agent-secrets
  namespace: ocr-agent
  labels:
    app: ocr-agent
type: Opaque
stringData:
  # LLM API Keys - Replace with actual values
  DEEPSEEK_API_KEY: "your-deepseek-api-key"
  QWEN_API_KEY: "your-qwen-api-key"
  OPENAI_API_KEY: "your-openai-api-key"
  ANTHROPIC_API_KEY: "your-anthropic-api-key"
  
  # OCR API Keys (if using cloud OCR services)
  BAIDU_OCR_API_KEY: "your-baidu-api-key"
  BAIDU_OCR_SECRET_KEY: "your-baidu-secret-key"
  TENCENT_OCR_SECRET_ID: "your-tencent-secret-id"
  TENCENT_OCR_SECRET_KEY: "your-tencent-secret-key"
  
  # Database credentials (if using external database)
  DATABASE_URL: "sqlite:///data/ocr-agent.db"
  
  # Redis password (if using Redis cache)
  REDIS_PASSWORD: ""
