apiVersion: v1
kind: Service
metadata:
  name: ocr-agent
  namespace: ocr-agent
  labels:
    app: ocr-agent
spec:
  type: ClusterIP
  selector:
    app: ocr-agent
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP

---
# Headless service for stateful operations
apiVersion: v1
kind: Service
metadata:
  name: ocr-agent-headless
  namespace: ocr-agent
  labels:
    app: ocr-agent
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: ocr-agent
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
