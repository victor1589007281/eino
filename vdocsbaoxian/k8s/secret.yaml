apiVersion: v1
kind: Secret
metadata:
  name: insurance-expert-secrets
  namespace: insurance-expert
  labels:
    app: insurance-expert
type: Opaque
stringData:
  # LLM Provider API Keys (replace with actual values)
  ZHIPU_API_KEY: "your-zhipu-api-key"
  DEEPSEEK_API_KEY: "your-deepseek-api-key"
  OPENAI_API_KEY: "your-openai-api-key"
  ANTHROPIC_API_KEY: "your-anthropic-api-key"
  
  # Database credentials (if using external MySQL)
  MYSQL_HOST: "mysql-service"
  MYSQL_PASSWORD: "your-mysql-password"
  
  # Redis password (if using authentication)
  REDIS_PASSWORD: ""
