# 微信公众号文章润色专家 Agent 配置文件

# 服务器配置
server:
  port: 8080
  read_timeout: 30s
  write_timeout: 120s
  idle_timeout: 60s

# LLM配置
llm:
  provider: "deepseek"
  default_model: "deepseek-chat"
  max_tokens: 4096
  temperature: 0.3
  request_timeout: 120s
  max_retries: 3
  retry_interval: 2s
  
  # API密钥
  api_keys:
    deepseek: "sk-****"

# Agent配置
agent:
  max_iterations: 20
  max_concurrent_agents: 5
  timeout: 300s
  enable_sub_agents: true

# 输入配置
input:
  markdown_file_path: "./articles"
  max_file_size_mb: 10

# 输出配置
output:
  work_directory: "./output"
  format: "markdown"
  include_diagrams: true
  include_code_refs: false
  summary_max_length: 500

# 索引配置
index:
  path: "./data/index"
  rebuild_on_start: false
  parallel_workers: 4
  min_token_length: 2
  max_token_length: 20

# 存储配置
storage:
  provider: "sqlite"
  local_db_path: "./data"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 5m

# 缓存配置
cache:
  enable: true
  provider: "lru"
  ttl: 30m
  max_size: 10000

# 统计配置
stats:
  enable: true
  report_interval: 60s

# 技能配置
skills:
  directory: "./skills"
  enable: true

# K8S部署配置
k8s:
  enable: false
  namespace: "wechat-polish"
  image: "wechat-polish:latest"
  replicas: 2
