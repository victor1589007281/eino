apiVersion: apps/v1
kind: Deployment
metadata:
  name: wechat-polish
  namespace: wechat-polish
  labels:
    app: wechat-polish
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wechat-polish
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wechat-polish
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: wechat-polish
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: wechat-polish
        image: wechat-polish:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        env:
        # LLM API Keys from Secrets
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: wechat-polish-secrets
              key: deepseek-api-key
        - name: QWEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: wechat-polish-secrets
              key: qwen-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: wechat-polish-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: wechat-polish-secrets
              key: anthropic-api-key
              optional: true
        - name: GLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: wechat-polish-secrets
              key: glm-api-key
              optional: true
        - name: MOONSHOT_API_KEY
          valueFrom:
            secretKeyRef:
              name: wechat-polish-secrets
              key: moonshot-api-key
              optional: true
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wechat-polish-secrets
              key: redis-password
              optional: true
        
        # 其他环境变量
        - name: TZ
          value: "Asia/Shanghai"
        - name: LOG_LEVEL
          value: "info"
        
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: data
          mountPath: /app/data
        - name: workspace
          mountPath: /app/workspace
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
      
      volumes:
      - name: config
        configMap:
          name: wechat-polish-config
      - name: data
        persistentVolumeClaim:
          claimName: wechat-polish-data
      - name: workspace
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - wechat-polish
              topologyKey: kubernetes.io/hostname
      
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wechat-polish
  namespace: wechat-polish
  labels:
    app: wechat-polish

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wechat-polish-data
  namespace: wechat-polish
  labels:
    app: wechat-polish
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # 根据集群实际情况修改
