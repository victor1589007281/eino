apiVersion: v1
kind: Secret
metadata:
  name: wechat-polish-secrets
  namespace: wechat-polish
  labels:
    app: wechat-polish
type: Opaque
stringData:
  # LLM API Keys - 请在部署前替换为实际值
  # 可以使用 kubectl create secret 命令创建
  # kubectl create secret generic wechat-polish-secrets \
  #   --from-literal=deepseek-api-key=your-key \
  #   --from-literal=qwen-api-key=your-key \
  #   -n wechat-polish
  
  # DeepSeek API Key
  deepseek-api-key: "YOUR_DEEPSEEK_API_KEY"
  
  # Qwen API Key (通义千问)
  qwen-api-key: "YOUR_QWEN_API_KEY"
  
  # OpenAI API Key (可选)
  openai-api-key: ""
  
  # Anthropic API Key (可选)
  anthropic-api-key: ""
  
  # GLM API Key (智谱AI, 可选)
  glm-api-key: ""
  
  # Moonshot API Key (月之暗面, 可选)
  moonshot-api-key: ""
  
  # Redis Password (如果使用Redis缓存)
  redis-password: ""
