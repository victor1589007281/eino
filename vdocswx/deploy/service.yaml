apiVersion: v1
kind: Service
metadata:
  name: wechat-polish
  namespace: wechat-polish
  labels:
    app: wechat-polish
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: wechat-polish

---
apiVersion: v1
kind: Service
metadata:
  name: wechat-polish-nodeport
  namespace: wechat-polish
  labels:
    app: wechat-polish
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  selector:
    app: wechat-polish

---
# 可选: Ingress配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wechat-polish
  namespace: wechat-polish
  labels:
    app: wechat-polish
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
  - host: wechat-polish.example.com  # 请替换为实际域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wechat-polish
            port:
              number: 80
  tls:
  - hosts:
    - wechat-polish.example.com
    secretName: wechat-polish-tls  # TLS证书Secret

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wechat-polish
  namespace: wechat-polish
  labels:
    app: wechat-polish
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wechat-polish
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
